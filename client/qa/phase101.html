<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 10.1 art and harvesting QA</title><link rel="stylesheet" href="/style.css"><style>html,body{height:auto;min-height:100%;overflow:auto}body{padding:18px}h1{font-size:24px;margin:0 0 8px}p{font-size:12px}#gallery,#feedback-scene{width:min(100%,1100px);height:auto;border:1px solid #080A09}#feedback-scene{max-width:640px}.qa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0}button,select{padding:8px;background:#1E241D;color:#F1F3ED;border:1px solid #414B3B;border-radius:4px}#qa-feedback{display:block;white-space:pre-wrap;line-height:1.6;font-size:12px;padding:10px;background:#141814}#qa-dock{position:relative;inset:auto;transform:none;width:min(1100px,100%);margin:20px 0}#qa-dock .building-slot{max-width:110px}#qa-dock .bottom-bar{position:static}#qa-dock .building-panel{position:static}</style><h1>PHASE 10.1 · VECTOR ART QA</h1><p>Production player/tools/resources/icons. Manual feedback frames freeze the actual Canvas output for inspection; this page does not change the game session.</p><div class="qa-controls"><label for="qa-swing">Tool swing</label><input id="qa-swing" type="range" min="-0.65" max="0.65" step="0.05" value="0"></div><canvas id="gallery" width="1100" height="650" aria-label="Player facing four directions, nine tool tiers, trees, rocks and unchanged zombies"></canvas><div id="dock-mount"></div><h2>Formation feedback · manual clock</h2><div class="qa-controls"><select id="qa-kind" aria-label="Formation type"><option value="tree">Single tree</option><option value="stone">Single stone</option><option value="trees" selected>Double tree</option><option value="stones">Double stone</option><option value="mixed">Mixed tree and stone</option></select><select id="qa-tool" aria-label="Selected tool"><option value="pickaxe">Pickaxe</option><option value="sword">Sword</option></select><button id="qa-hit">Harvest: render hit frame</button><button id="qa-next">Render next frame</button><button id="qa-peak">Impact midpoint</button><button id="qa-finish">Finish feedback</button></div><canvas id="feedback-scene" width="640" height="240" aria-label="Formation harvesting feedback"></canvas><output id="qa-feedback"></output><script type="module" src="/qa/phase101.js"></script></html>
