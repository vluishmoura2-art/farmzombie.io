<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu layout QA</title><style>body{margin:0;padding:12px;background:#10170f;color:#e7eddb;font:12px Arial}h1{font-size:14px;margin:0 0 8px}#frame-box{position:relative}iframe{border:1px solid #72835c;transform-origin:top left;display:block;position:absolute;top:0;left:0}</style></head><body><h1 id="label"></h1><div id="frame-box"><iframe title="Menu viewport" src="/" id="menu-frame"></iframe></div><script>const sizes={mobile:[390,844,.6],tablet:[768,1024,.48],small:[320,640,.8],desktop:[1280,800,.48],ultrawide:[2560,1080,.24]};const key=new URLSearchParams(location.search).get('size')||'mobile';const [w,h,scale]=sizes[key]||sizes.mobile;const frame=document.querySelector('iframe');frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;document.querySelector('#frame-box').style.cssText=`width:${w*scale}px;height:${h*scale}px`;document.querySelector('#label').textContent=`${key}: ${w} x ${h}`;</script></body></html>
