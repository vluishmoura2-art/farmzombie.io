<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 6 combat QA fixture</title>
<style>body{margin:0;font:14px Segoe UI,sans-serif;background:#78b84a;color:#203b25}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:12px;left:12px;right:12px;padding:12px;background:#f4f0df;border:1px solid #55351f;border-radius:6px}button,select{padding:6px;margin:3px}#result{white-space:pre-wrap;font-size:12px}h1{font-size:16px;margin:0 0 6px}#legend{position:fixed;bottom:18px;left:18px;right:18px;background:#f4f0df;padding:12px;display:flex;gap:18px;flex-wrap:wrap}#legend span{white-space:pre-line}</style></head>
<body><canvas id="game"></canvas><nav><h1>Phase 6 QA fixture — isolated test world</h1><button id="categories">Three categories</button><button id="sword">Sword scenario</button><select id="tower-type"><option>ballista</option><option>cannon</option><option>melee</option><option>bomb</option><option>mage</option></select><button id="towers">Tower scenario</button><button id="swing">Sword hit</button><button id="tick">Advance 1s</button><button id="night">Advance to night</button><button id="defeat">Stash defeat scenario</button><output id="result"></output></nav><div id="legend"></div><script type="module" src="./combat-fixture.js"></script></body></html>
